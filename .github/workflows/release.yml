name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v"
        required: true
        type: string
      build:
        description: "Positive build number / CFBundleVersion"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codexswitch-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            build="${{ inputs.build }}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            build="${GITHUB_RUN_NUMBER}"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          [[ "$build" =~ ^[1-9][0-9]*$ ]]
          [ "$tag" = "v$version" ]
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
            echo "release_dir=dist/release/$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY
          do
            [ -n "${!name:-}" ] || { echo "Missing required secret: $name" >&2; exit 1; }
          done

      - name: Run tests
        run: |
          scripts/release/with_timeout.py 2400 \
            xcodebuild \
            -project CodexSwitch.xcodeproj \
            -scheme CodexSwitch \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Check source diff
        run: git diff --check

      - name: Import Developer ID certificate
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer_id_application.p12"
          keychain_path="$RUNNER_TEMP/codexswitch-signing.keychain-db"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "developer_id_application.p12").write_bytes(base64.b64decode(os.environ["DEVELOPER_ID_CERTIFICATE_BASE64"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Write App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build notarized release artifacts
        run: |
          scripts/release/build_release.sh \
            --version "${{ steps.release.outputs.version }}" \
            --build "${{ steps.release.outputs.build }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_DIR: ${{ steps.release.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          repository_notes="docs/release-notes/v${VERSION}.md"
          if [ -f "$repository_notes" ]; then
            cp "$repository_notes" "$notes"
          else
            printf '# CodexSwitch %s\n\nSigned and notarized macOS release.\n' "$VERSION" > "$notes"
          fi
          assets=(
            "$RELEASE_DIR/CodexSwitch-$VERSION.dmg"
            "$RELEASE_DIR/CodexSwitch-$VERSION.zip"
            "$RELEASE_DIR/SHA256SUMS.txt"
            "$RELEASE_DIR/release-manifest.json"
          )
          if scripts/release/with_timeout.py 300 gh release view "$TAG" >/dev/null 2>&1; then
            scripts/release/with_timeout.py 900 gh release upload "$TAG" "${assets[@]}" --clobber
            scripts/release/with_timeout.py 300 gh release edit "$TAG" --title "CodexSwitch $VERSION" --notes-file "$notes" --draft=false --prerelease=false
          else
            scripts/release/with_timeout.py 900 gh release create "$TAG" "${assets[@]}" --title "CodexSwitch $VERSION" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
