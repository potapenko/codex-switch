name: CodexSwitch
options:
  bundleIdPrefix: com.eugenepotapenko
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  CodexSwitch:
    type: application
    platform: macOS
    sources:
      - path: CodexSwitch
    info:
      path: CodexSwitch/Info.plist
      properties:
        CFBundleDisplayName: CodexSwitch
        CFBundleName: CodexSwitch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenepotapenko.CodexSwitch
        PRODUCT_NAME: CodexSwitch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CodexSwitch/Info.plist
  CodexSwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CodexSwitchTests
    dependencies:
      - target: CodexSwitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenepotapenko.CodexSwitchTests
        GENERATE_INFOPLIST_FILE: YES
